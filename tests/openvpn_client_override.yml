---

- name: Testing OpenVPN Client-Overwrite
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'openvpn_client_override'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Check mode - listing before
      oxlorg.opnsense.list:
        target: 'openvpn_client_override'
      register: opn_cm_before
      when: ansible_check_mode

    - name: Adding Dummy Servers
      oxlorg.opnsense.openvpn_server:
        name: 'ANSIBLE_TEST_3_1'
        server: '192.168.77.0/29'
        ca: 'OpenVPN'
        certificate: 'OpenVPN Server'
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        'data' not in opn_pre1 or
        opn_pre1.data | length != 0

    - name: Removing - does not exist
      oxlorg.opnsense.openvpn_client_override:
        name: 'ANSIBLE_TEST_1_1'
        state: 'absent'
      register: opn_pre2
      failed_when: >
        opn_pre2.failed or
        opn_pre2.changed

    - name: Adding 1 - failing because no servers were provided
      oxlorg.opnsense.openvpn_client_override:
        name: 'ANSIBLE_TEST_1_1'
      register: opn_fail1
      failed_when: not opn_fail1.failed

    - name: Adding 1
      oxlorg.opnsense.openvpn_client_override:
        name: 'ANSIBLE_TEST_1_1'
        servers: 'ANSIBLE_TEST_3_1'
        redirect_gateway: '!ipv4'
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed
      when: not ansible_check_mode

    - name: Changing 1
      oxlorg.opnsense.openvpn_client_override:
        name: 'ANSIBLE_TEST_1_1'
        servers: 'ANSIBLE_TEST_3_1'
        block: true
        network_tunnel_ip4: '192.168.77.3/29'
        network_local: ['192.168.78.128/27']
        domain: 'test.vpn'
        dns_servers: ['1.1.1.1', '8.8.8.8']
      register: opn9
      failed_when: >
        opn9.failed or
        not opn9.changed
      when: not ansible_check_mode

    - name: Changing 1 - nothing changed
      oxlorg.opnsense.openvpn_client_override:
        name: 'ANSIBLE_TEST_1_1'
        servers: 'ANSIBLE_TEST_3_1'
        block: true
        network_tunnel_ip4: '192.168.77.3/29'
        network_local: ['192.168.78.128/27']
        domain: 'test.vpn'
        dns_servers: ['1.1.1.1', '8.8.8.8']
      register: opn_rr1
      failed_when: >
        opn_rr1.failed or
        opn_rr1.changed
      when: not ansible_check_mode

    - name: Changing 1 - read back
      oxlorg.opnsense.list:
        target: 'openvpn_client_override'
      register: opn_rb1
      vars:
        rb_entry: >-
          {{ opn_rb1.data | selectattr('name', 'equalto', "ANSIBLE_TEST_1_1") | list }}
        rb_dns_servers: >-
          {{ rb_entry[0]['dns_servers'].split(',') if rb_entry[0]['dns_servers'] is string else rb_entry[0]['dns_servers'] }}
      failed_when: >
        opn_rb1.failed or
        rb_entry | length != 1 or
        (rb_entry[0]['block'] | string | lower) not in ['true', '1', 'yes', 'on'] or
        (rb_dns_servers | map('string') | sort | join(',')) != "1.1.1.1,8.8.8.8" or
        (rb_entry[0]['domain'] | string) != "test.vpn"
      when: not ansible_check_mode

    - name: Disabling 1
      oxlorg.opnsense.openvpn_client_override:
        name: 'ANSIBLE_TEST_1_1'
        servers: 'ANSIBLE_TEST_3_1'
        block: true
        network_tunnel_ip4: '192.168.77.3/29'
        network_local: ['192.168.78.128/27']
        domain: 'test.vpn'
        dns_servers: ['1.1.1.1', '8.8.8.8']
        enabled: false
      register: opn2
      failed_when: >
        opn2.failed or
        not opn2.changed
      when: not ansible_check_mode

    - name: Disabling 1 - nothing changed
      oxlorg.opnsense.openvpn_client_override:
        name: 'ANSIBLE_TEST_1_1'
        servers: 'ANSIBLE_TEST_3_1'
        block: true
        network_tunnel_ip4: '192.168.77.3/29'
        network_local: ['192.168.78.128/27']
        domain: 'test.vpn'
        dns_servers: ['1.1.1.1', '8.8.8.8']
        enabled: false
      register: opn3
      failed_when: >
        opn3.failed or
        opn3.changed
      when: not ansible_check_mode

    - name: Enabling 1
      oxlorg.opnsense.openvpn_client_override:
        name: 'ANSIBLE_TEST_1_1'
        servers: 'ANSIBLE_TEST_3_1'
        block: true
        network_tunnel_ip4: '192.168.77.3/29'
        network_local: ['192.168.78.128/27']
        domain: 'test.vpn'
        dns_servers: ['1.1.1.1', '8.8.8.8']
      register: opn4
      failed_when: >
        opn4.failed or
        not opn4.changed
      when: not ansible_check_mode

    - name: Adding 2
      oxlorg.opnsense.openvpn_client_override:
        name: 'ANSIBLE_TEST_1_2'
        servers: 'ANSIBLE_TEST_3_1'
        ntp_servers: '192.168.1.1'
        register_dns: true
        domain_list: ['internal', 'test.local']
      register: opn5
      failed_when: >
        opn5.failed or
        not opn5.changed
      when: not ansible_check_mode

    - name: Adding 2 - nothing changed
      oxlorg.opnsense.openvpn_client_override:
        name: 'ANSIBLE_TEST_1_2'
        servers: 'ANSIBLE_TEST_3_1'
        ntp_servers: '192.168.1.1'
        register_dns: true
        domain_list: ['internal', 'test.local']
      register: opn5_2
      failed_when: >
        opn5_2.failed or
        opn5_2.changed
      when: not ansible_check_mode

    - name: Removing 2
      oxlorg.opnsense.openvpn_client_override:
        name: 'ANSIBLE_TEST_1_2'
        state: 'absent'
      register: opn7
      failed_when: >
        opn7.failed or
        not opn7.changed
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn8
      failed_when: >
        'data' not in opn8 or
        opn8.data | length != 1
      when: not ansible_check_mode

    - name: Cleanup
      oxlorg.opnsense.openvpn_client_override:
        name: "{{ item }}"
        state: 'absent'
      loop:
        - 'ANSIBLE_TEST_1_1'
        - 'ANSIBLE_TEST_1_2'
      when: not ansible_check_mode

    - name: Cleanup Server
      oxlorg.opnsense.openvpn_server:
        name: 'ANSIBLE_TEST_3_1'
        state: 'absent'
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_post1
      failed_when: >
        'data' not in opn_post1 or
        opn_post1.data | length != 0
      when: not ansible_check_mode

    - name: Check mode - nothing was written
      oxlorg.opnsense.list:
        target: 'openvpn_client_override'
      register: opn_cm_after
      failed_when: >
        opn_cm_after.failed or
        (opn_cm_after.data | to_json) != (opn_cm_before.data | to_json)
      when: ansible_check_mode
