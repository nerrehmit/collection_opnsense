---

- name: Testing Bridge interfaces
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'interface_bridge'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Check mode - listing before
      oxlorg.opnsense.list:
        target: 'interface_bridge'
      register: opn_cm_before
      when: ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        'data' not in opn_pre1 or
        opn_pre1.data | length != 0

    - name: Removing - does not exist
      oxlorg.opnsense.interface_bridge:
        description: 'ANSIBLE_TEST_1_1'
        state: 'absent'
      register: opn_pre2
      failed_when: >
        opn_pre2.failed or
        opn_pre2.changed

    - name: Adding 1
      oxlorg.opnsense.interface_bridge:
        description: 'ANSIBLE_TEST_1_1'
        members:
          - 'opt1'
          - 'opt2'
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed

    - name: Changing 1
      oxlorg.opnsense.interface_bridge:
        description: 'ANSIBLE_TEST_1_1'
        members: 'opt1'
        link_local: true
        span_interfaces: 'opt2'
      register: opn2
      failed_when: >
        opn2.failed or
        not opn2.changed

    - name: Changing 1 - nothing changed
      oxlorg.opnsense.interface_bridge:
        description: 'ANSIBLE_TEST_1_1'
        members: 'opt1'
        link_local: true
        span_interfaces: 'opt2'
      register: opn3
      failed_when: >
        opn3.failed or
        opn3.changed
      when: not ansible_check_mode

    - name: Changing 1 - read back
      oxlorg.opnsense.list:
        target: 'interface_bridge'
      register: opn_rb1
      vars:
        rb_entry: >-
          {{ opn_rb1.data | selectattr('description', 'equalto', "ANSIBLE_TEST_1_1") | list }}
        rb_members: >-
          {{ rb_entry[0]['members'].split(',') if rb_entry[0]['members'] is string else rb_entry[0]['members'] }}
        rb_span_interfaces: >-
          {{ rb_entry[0]['span_interfaces'].split(',') if rb_entry[0]['span_interfaces'] is string else rb_entry[0]['span_interfaces'] }}
      failed_when: >
        opn_rb1.failed or
        rb_entry | length != 1 or
        (rb_entry[0]['link_local'] | string | lower) not in ['true', '1', 'yes', 'on'] or
        (rb_members | map('string') | sort | join(',')) != "opt1" or
        (rb_span_interfaces | map('string') | sort | join(',')) != "opt2"
      when: not ansible_check_mode

    - name: Adding 2
      oxlorg.opnsense.interface_bridge:
        description: 'ANSIBLE_TEST_1_2'
        members:
          - 'opt1'
          - 'opt2'
        link_local: true
        stp: true
        stp_proto: 'stp'
        stp_interfaces: 'opt1'
        stp_max_age: 10
        stp_fwdelay: 10
        stp_hold: 5
        cache_size: 1000
        cache_timeout: 600
        edge_interfaces: 'opt1'
        auto_edge_interfaces: 'opt2'
        ptp_interfaces: 'opt1'
        auto_ptp_interfaces: 'opt2'
        static_interfaces: 'opt1'
        private_interfaces: 'opt2'
      register: opn4
      failed_when: >
        opn4.failed or
        not opn4.changed

    - name: Adding 2 - nothing changed
      oxlorg.opnsense.interface_bridge:
        description: 'ANSIBLE_TEST_1_2'
        members:
          - 'opt1'
          - 'opt2'
        link_local: true
        stp: true
        stp_proto: 'stp'
        stp_interfaces: 'opt1'
        stp_max_age: 10
        stp_fwdelay: 10
        stp_hold: 5
        cache_size: 1000
        cache_timeout: 600
        edge_interfaces: 'opt1'
        auto_edge_interfaces: 'opt2'
        ptp_interfaces: 'opt1'
        auto_ptp_interfaces: 'opt2'
        static_interfaces: 'opt1'
        private_interfaces: 'opt2'
      register: opn5
      failed_when: >
        opn5.failed or
        opn5.changed
      when: not ansible_check_mode

    - name: Removing 2
      oxlorg.opnsense.interface_bridge:
        description: 'ANSIBLE_TEST_1_2'
        state: 'absent'
      register: opn6
      failed_when: >
        opn6.failed or
        not opn6.changed
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn7
      failed_when: >
        'data' not in opn7 or
        opn7.data | length != 1
      when: not ansible_check_mode

    - name: Cleanup
      oxlorg.opnsense.interface_bridge:
        description: '{{ item }}'
        state: 'absent'
      loop:
        - 'ANSIBLE_TEST_1_1'
        - 'ANSIBLE_TEST_1_2'
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_clean1
      failed_when: >
        'data' not in opn_clean1 or
        opn_clean1.data | length != 0
      when: not ansible_check_mode

    - name: Check mode - nothing was written
      oxlorg.opnsense.list:
        target: 'interface_bridge'
      register: opn_cm_after
      failed_when: >
        opn_cm_after.failed or
        (opn_cm_after.data | to_json) != (opn_cm_before.data | to_json)
      when: ansible_check_mode
