---

- name: Testing source-nat
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.source_nat:
      match_fields: ['description']

    oxlorg.opnsense.list:
      target: 'source_nat'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Check mode - listing before
      oxlorg.opnsense.list:
        target: 'nat_source'
      register: opn_cm_before
      when: ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        'data' not in opn_pre1 or
        opn_pre1.data | length != 0

    - name: Removing - does not exist
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_1'
        state: 'absent'
      register: opn_pre2
      failed_when: >
        opn_pre2.failed or
        opn_pre2.changed

    - name: Adding 1 - failing because of invalid alias (server-side)
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'lan'
        destination: 'DoesNotExist'
        target: '192.168.0.2'
      register: opn_fail2
      failed_when: not opn_fail2.failed
      when: not ansible_check_mode

    - name: Adding 1
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'lan'
        destination: '192.168.0.1'
        target: '192.168.0.2'
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed

    - name: Changing 1
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'lan'
        destination: '192.168.0.1'
        protocol: 'TCP'
        target: '192.168.0.5'
      register: opn9
      failed_when: >
        opn9.failed or
        not opn9.changed

    - name: Changing 1 - nothing changed
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'lan'
        destination: '192.168.0.1'
        protocol: 'TCP'
        target: '192.168.0.5'
      register: opn_rr1
      failed_when: >
        opn_rr1.failed or
        opn_rr1.changed
      when: not ansible_check_mode

    - name: Changing 1 - read back
      oxlorg.opnsense.list:
        target: 'nat_source'
      register: opn_rb1
      vars:
        rb_entry: >-
          {{ opn_rb1.data | selectattr('description', 'equalto', "ANSIBLE_TEST_1_1") | list }}
      failed_when: >
        opn_rb1.failed or
        rb_entry | length != 1 or
        (rb_entry[0]['protocol'] | string) != "TCP" or
        (rb_entry[0]['target'] | string) != "192.168.0.5"
      when: not ansible_check_mode

    - name: Changing 1 - changed with reload
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'lan'
        destination: '192.168.0.1'
        protocol: 'TCP'
        target: '192.168.0.5'
        reload: true
        enabled: false
      register: opn_rl4_1
      failed_when: >
        opn_rl4_1.failed or
        not opn_rl4_1.changed
      when: not ansible_check_mode

    - name: Changing 1 - changed back with reload
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'lan'
        destination: '192.168.0.1'
        protocol: 'TCP'
        target: '192.168.0.5'
        reload: true
      register: opn_rl4_2
      failed_when: >
        opn_rl4_2.failed or
        not opn_rl4_2.changed
      when: not ansible_check_mode

    - name: Disabling 1
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'lan'
        destination: '192.168.0.1'
        protocol: 'TCP'
        target: '192.168.0.5'
        enabled: false
      register: opn2
      failed_when: >
        opn2.failed or
        not opn2.changed
      when: not ansible_check_mode

    - name: Disabling 1 - nothing changed (w/ module alias)
      oxlorg.opnsense.snat:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'lan'
        destination: '192.168.0.1'
        protocol: 'TCP'
        target: '192.168.0.5'
        enabled: false
      register: opn3
      failed_when: >
        opn3.failed or
        opn3.changed
      when: not ansible_check_mode

    - name: Enabling 1
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_1'
        interface: 'lan'
        destination: '192.168.0.1'
        protocol: 'TCP'
        target: '192.168.0.5'
      register: opn4
      failed_when: >
        opn4.failed or
        not opn4.changed
      when: not ansible_check_mode

    - name: Adding 2
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_2'
        no_nat: true
        interface: 'lan'
        source_invert: true
        source: 'bogons'
        destination: '192.168.2.1'
        destination_port: 51820
        protocol: 'UDP'
        target: '192.168.3.1'
        target_port: 51822
      register: opn5
      failed_when: >
        opn5.failed or
        not opn5.changed

    - name: Adding 2 - nothing changed
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_2'
        no_nat: true
        interface: 'lan'
        source_invert: true
        source: 'bogons'
        destination: '192.168.2.1'
        destination_port: 51820
        protocol: 'UDP'
        target: '192.168.3.1'
        target_port: 51822
      register: opn6
      failed_when: >
        opn6.failed or
        opn6.changed
      when: not ansible_check_mode

    - name: Removing 2
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_2'
        state: 'absent'
      register: opn7
      failed_when: >
        opn7.failed or
        not opn7.changed
      when: not ansible_check_mode

    - name: Adding 3 - with static_port
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_3'
        interface: 'lan'
        protocol: 'UDP'
        source: 'any'
        target: '192.168.3.1'
        static_port: true
      register: opn_sp1
      failed_when: >
        opn_sp1.failed or
        not opn_sp1.changed

    - name: Adding 3 - nothing changed
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_3'
        interface: 'lan'
        protocol: 'UDP'
        source: 'any'
        target: '192.168.3.1'
        static_port: true
      register: opn_sp2
      failed_when: >
        opn_sp2.failed or
        opn_sp2.changed
      when: not ansible_check_mode

    - name: Disabling static_port on 3
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_3'
        interface: 'lan'
        protocol: 'UDP'
        source: 'any'
        target: '192.168.3.1'
        static_port: false
      register: opn_sp3
      failed_when: >
        opn_sp3.failed or
        not opn_sp3.changed
      when: not ansible_check_mode

    - name: Disabling static_port on 3 - nothing changed
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_3'
        interface: 'lan'
        protocol: 'UDP'
        source: 'any'
        target: '192.168.3.1'
        static_port: false
      register: opn_rr2
      failed_when: >
        opn_rr2.failed or
        opn_rr2.changed
      when: not ansible_check_mode

    - name: Re-enabling static_port on 3 (idempotent toggle)
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_3'
        interface: 'lan'
        protocol: 'UDP'
        source: 'any'
        target: '192.168.3.1'
        static_port: true
      register: opn_sp4
      failed_when: >
        opn_sp4.failed or
        not opn_sp4.changed
      when: not ansible_check_mode

    - name: Re-enabling static_port on 3 (idempotent toggle) - nothing changed
      oxlorg.opnsense.source_nat:
        description: 'ANSIBLE_TEST_1_3'
        interface: 'lan'
        protocol: 'UDP'
        source: 'any'
        target: '192.168.3.1'
        static_port: true
      register: opn_rr3
      failed_when: >
        opn_rr3.failed or
        opn_rr3.changed
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn8
      failed_when: >
        'data' not in opn8 or
        opn8.data | length != 2
      when: not ansible_check_mode

    - name: Cleanup
      oxlorg.opnsense.source_nat:
        description: "{{ item }}"
        state: 'absent'
      loop:
        - 'ANSIBLE_TEST_1_1'
        - 'ANSIBLE_TEST_1_2'
        - 'ANSIBLE_TEST_1_3'
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_clean1
      failed_when: >
        'data' not in opn_clean1 or
        opn_clean1.data | length != 0
      when: not ansible_check_mode

    - name: Check mode - nothing was written
      oxlorg.opnsense.list:
        target: 'nat_source'
      register: opn_cm_after
      failed_when: >
        opn_cm_after.failed or
        (opn_cm_after.data | to_json) != (opn_cm_before.data | to_json)
      when: ansible_check_mode
