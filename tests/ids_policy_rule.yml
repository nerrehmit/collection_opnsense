---

- name: Testing IDS Policy-Rule
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'ids_policy_rule'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Check mode - listing before
      oxlorg.opnsense.list:
        target: 'ids_policy_rule'
      register: opn_cm_before
      when: ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        opn_pre1.failed or
        'data' not in opn_pre1

    - name: Adding 1
      oxlorg.opnsense.ids_policy_rule:
        sid: 2400000
        action: 'alert'

    - name: Adding 1 - nothing changed
      oxlorg.opnsense.ids_policy_rule:
        sid: 2400000
        action: 'alert'
      register: opn6
      failed_when: >
        opn6.failed or
        opn6.changed
      when: not ansible_check_mode

    - name: Changing 1
      oxlorg.opnsense.ids_policy_rule:
        sid: 2400000
        action: 'drop'
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed
      when: not ansible_check_mode

    - name: Changing 1 - nothing changed
      oxlorg.opnsense.ids_policy_rule:
        sid: 2400000
        action: 'drop'
      register: opn5
      failed_when: >
        opn5.failed or
        opn5.changed
      when: not ansible_check_mode

    # list returns this target with the API field names
    - name: Changing 1 - read back
      oxlorg.opnsense.list:
        target: 'ids_policy_rule'
      register: opn_rb1
      vars:
        rb_entry: >-
          {{ opn_rb1.data | selectattr('sid', 'in', [2400000, "2400000"]) | list }}
      failed_when: >
        opn_rb1.failed or
        rb_entry | length != 1 or
        (rb_entry[0]['action'] | string) != "drop"
      when: not ansible_check_mode

    - name: Disabling 1
      oxlorg.opnsense.ids_policy_rule:
        sid: 2400000
        action: 'drop'
        enabled: false
      register: opn2
      failed_when: >
        opn2.failed or
        not opn2.changed
      when: not ansible_check_mode

    - name: Disabling 1 - nothing changed
      oxlorg.opnsense.ids_policy_rule:
        sid: 2400000
        action: 'drop'
        enabled: false
      register: opn3
      failed_when: >
        opn3.failed or
        opn3.changed
      when: not ansible_check_mode

    - name: Enabling 1
      oxlorg.opnsense.ids_policy_rule:
        sid: 2400000
        action: 'drop'
        enabled: true
      register: opn4
      failed_when: >
        opn4.failed or
        not opn4.changed
      when: not ansible_check_mode

    - name: Cleanup
      oxlorg.opnsense.ids_policy_rule:
        sid: 2400000
        state: absent
      when: not ansible_check_mode

    - name: Check mode - nothing was written
      oxlorg.opnsense.list:
        target: 'ids_policy_rule'
      register: opn_cm_after
      failed_when: >
        opn_cm_after.failed or
        (opn_cm_after.data | to_json) != (opn_cm_before.data | to_json)
      when: ansible_check_mode
