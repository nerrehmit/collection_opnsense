---

- name: Testing Postfix Domain
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'postfix_domain'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Check mode - listing before
      oxlorg.opnsense.list:
        target: 'postfix_domain'
      register: opn_cm_before
      when: ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        'data' not in opn_pre1 or
        opn_pre1.data | length != 0

    - name: Removing - does not exist
      oxlorg.opnsense.postfix_domain:
        domainname: 'ANSIBLE_TEST_99_9'
        state: 'absent'
      register: opn_pre2
      failed_when: >
        opn_pre2.failed or
        opn_pre2.changed

    - name: Adding 1
      oxlorg.opnsense.postfix_domain:
        domainname: example.com
        destination: 192.168.100.2
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed

    - name: Changing 1
      oxlorg.opnsense.postfix_domain:
        domainname: example.com
        destination: 192.168.100.3
      register: opn2
      failed_when: >
        opn2.failed or
        not opn2.changed

    - name: Changing 1 - nothing changed
      oxlorg.opnsense.postfix_domain:
        domainname: example.com
        destination: 192.168.100.3
      register: opn_rr1
      failed_when: >
        opn_rr1.failed or
        opn_rr1.changed
      when: not ansible_check_mode

    - name: Changing 1 - read back
      oxlorg.opnsense.list:
        target: 'postfix_domain'
      register: opn_rb1
      vars:
        rb_entry: >-
          {{ opn_rb1.data | selectattr('domainname', 'equalto', "example.com") | list }}
      failed_when: >
        opn_rb1.failed or
        rb_entry | length != 1 or
        (rb_entry[0]['destination'] | string) != "192.168.100.3"
      when: not ansible_check_mode

    - name: Reload - service status before
      oxlorg.opnsense.service:
        name: 'postfix'
        action: 'status'
      register: opn_rl_svc26
      when: not ansible_check_mode

    - name: Changing 1 - changed with reload
      oxlorg.opnsense.postfix_domain:
        domainname: example.com
        destination: 192.168.100.3
        reload: true
        enabled: false
      register: opn_rl26_1
      failed_when: >
        opn_rl26_1.failed or
        not opn_rl26_1.changed
      when: not ansible_check_mode

    - name: Changing 1 - changed back with reload
      oxlorg.opnsense.postfix_domain:
        domainname: example.com
        destination: 192.168.100.3
        reload: true
      register: opn_rl26_2
      failed_when: >
        opn_rl26_2.failed or
        not opn_rl26_2.changed
      when: not ansible_check_mode

    - name: Reload - service status unchanged
      oxlorg.opnsense.service:
        name: 'postfix'
        action: 'status'
      register: opn_rl_svc26_after
      failed_when: >
        opn_rl_svc26_after.failed or
        (opn_rl_svc26_after.data.status | default('')) != (opn_rl_svc26.data.status | default(''))
      when: not ansible_check_mode

    - name: Disabling 1
      oxlorg.opnsense.postfix_domain:
        domainname: example.com
        destination: 192.168.100.3
        enabled: false
      register: opn3
      failed_when: >
        opn3.failed or
        not opn3.changed
      when: not ansible_check_mode

    - name: Disabling 1 - nothing changed
      oxlorg.opnsense.postfix_domain:
        domainname: example.com
        destination: 192.168.100.3
        enabled: false
      register: opn4
      failed_when: >
        opn4.failed or
        opn4.changed
      when: not ansible_check_mode

    - name: Enabling 1
      oxlorg.opnsense.postfix_domain:
        domainname: example.com
        destination: 192.168.100.3
      register: opn5
      failed_when: >
        opn5.failed or
        not opn5.changed
      when: not ansible_check_mode

    - name: Adding 2
      oxlorg.opnsense.postfix_domain:
        domainname: example.net
      register: opn6
      failed_when: >
        opn6.failed or
        not opn6.changed

    - name: Adding 2 - nothing changed
      oxlorg.opnsense.postfix_domain:
        domainname: example.net
      register: opn7
      failed_when: >
        opn7.failed or
        opn7.changed
      when: not ansible_check_mode

    - name: Removing 2
      oxlorg.opnsense.postfix_domain:
        domainname: example.net
        state: 'absent'
      register: opn8
      failed_when: >
        opn8.failed or
        not opn8.changed
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn9
      failed_when: >
        'data' not in opn9 or
        opn9.data | length != 1
      when: not ansible_check_mode

    - name: Cleanup
      oxlorg.opnsense.postfix_domain:
        domainname: example.com
        state: 'absent'
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_clean1
      failed_when: >
        'data' not in opn_clean1 or
        opn_clean1.data | length != 0
      when: not ansible_check_mode

    - name: Check mode - nothing was written
      oxlorg.opnsense.list:
        target: 'postfix_domain'
      register: opn_cm_after
      failed_when: >
        opn_cm_after.failed or
        (opn_cm_after.data | to_json) != (opn_cm_before.data | to_json)
      when: ansible_check_mode
