---

- name: Testing FRR-OSPFv3 interfaces
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.frr_ospf3_interface:
      match_fields: ['interface']

    oxlorg.opnsense.list:
      target: 'frr_ospf3_interface'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Check mode - listing before
      oxlorg.opnsense.list:
        target: 'frr_ospf3_interface'
      register: opn_cm_before
      when: ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        'data' not in opn_pre1 or
        opn_pre1.data | length != 0

    - name: Removing - does not exist
      oxlorg.opnsense.frr_ospf3_interface:
        interface: 'lan'
        state: 'absent'
      register: opn_pre2
      failed_when: >
        opn_pre2.failed or
        opn_pre2.changed

    - name: Adding 1 - failing because of invalid cost
      oxlorg.opnsense.frr_ospf3_interface:
        interface: 'lan'
        area: '0.0.0.0'
        cost: 4300000000
      register: opn_fail1
      failed_when: not opn_fail1.failed

    - name: Adding 1 - failing because of invalid cost_demoted
      oxlorg.opnsense.frr_ospf3_interface:
        interface: 'lan'
        area: '0.0.0.0'
        field2: 70000
      register: opn_fail2
      failed_when: not opn_fail2.failed

    - name: Adding 1
      oxlorg.opnsense.frr_ospf3_interface:
        interface: 'lan'
        area: '0.0.0.0'
        cost: 250
        cost_demoted: 1000
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed

    - name: Changing 1
      oxlorg.opnsense.frr_ospf3_interface:
        interface: 'lan'
        area: '0.0.0.0'
        cost: 500
        cost_demoted: 2000
      register: opn9
      failed_when: >
        opn9.failed or
        not opn9.changed

    - name: Changing 1 - nothing changed
      oxlorg.opnsense.frr_ospf3_interface:
        interface: 'lan'
        area: '0.0.0.0'
        cost: 500
        cost_demoted: 2000
      register: opn_rr1
      failed_when: >
        opn_rr1.failed or
        opn_rr1.changed
      when: not ansible_check_mode

    - name: Changing 1 - read back
      oxlorg.opnsense.list:
        target: 'frr_ospf3_interface'
      register: opn_rb1
      vars:
        rb_entry: >-
          {{ opn_rb1.data | selectattr('interface', 'equalto', "lan") | list }}
      failed_when: >
        opn_rb1.failed or
        rb_entry | length != 1 or
        (rb_entry[0]['cost'] | string) != "500" or
        (rb_entry[0]['cost_demoted'] | string) != "2000"
      when: not ansible_check_mode

    - name: Disabling 1
      oxlorg.opnsense.frr_ospf3_interface:
        interface: 'lan'
        area: '0.0.0.0'
        cost: 500
        cost_demoted: 2000
        enabled: false
      register: opn2
      failed_when: >
        opn2.failed or
        not opn2.changed
      when: not ansible_check_mode

    - name: Disabling 1 - nothing changed
      oxlorg.opnsense.frr_ospf3_interface:
        interface: 'lan'
        area: '0.0.0.0'
        cost: 500
        cost_demoted: 2000
        enabled: false
      register: opn3
      failed_when: >
        opn3.failed or
        opn3.changed
      when: not ansible_check_mode

    - name: Enabling 1
      oxlorg.opnsense.frr_ospf3_interface:
        interface: 'lan'
        area: '0.0.0.0'
        cost: 500
        cost_demoted: 2000
      register: opn4
      failed_when: >
        opn4.failed or
        not opn4.changed
      when: not ansible_check_mode

    - name: Adding 2
      oxlorg.opnsense.frr_ospf3_interface:
        interface: 'opt1'
        area: '0.0.0.0'
        cost: 500
        cost_demoted: 2000
        hello_interval: 7000
        dead_interval: 5000
        retransmit_interval: 66
        transmit_delay: 60
        priority: 30
        network_type: 'point-to-point'
      register: opn5
      failed_when: >
        opn5.failed or
        not opn5.changed

    - name: Adding 2 - nothing changed
      oxlorg.opnsense.frr_ospf3_interface:
        interface: 'opt1'
        area: '0.0.0.0'
        cost: 500
        cost_demoted: 2000
        hello_interval: 7000
        dead_interval: 5000
        retransmit_interval: 66
        transmit_delay: 60
        priority: 30
        network_type: 'point-to-point'
      register: opn6
      failed_when: >
        opn6.failed or
        opn6.changed
      when: not ansible_check_mode

    - name: Removing 2
      oxlorg.opnsense.frr_ospf3_interface:
        interface: 'opt1'
        state: 'absent'
      register: opn7
      failed_when: >
        opn7.failed or
        not opn7.changed
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn8
      failed_when: >
        'data' not in opn8 or
        opn8.data | length != 1
      when: not ansible_check_mode

    - name: Cleanup
      oxlorg.opnsense.frr_ospf3_interface:
        interface: "{{ item }}"
        state: 'absent'
      loop:
        - 'opt1'
        - 'lan'
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_clean1
      failed_when: >
        'data' not in opn_clean1 or
        opn_clean1.data | length != 0
      when: not ansible_check_mode

    - name: Check mode - nothing was written
      oxlorg.opnsense.list:
        target: 'frr_ospf3_interface'
      register: opn_cm_after
      failed_when: >
        opn_cm_after.failed or
        (opn_cm_after.data | to_json) != (opn_cm_before.data | to_json)
      when: ansible_check_mode
