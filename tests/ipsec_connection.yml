---

- name: Testing IPSec tunnels/connections
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'ipsec_connection'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Check mode - listing before
      oxlorg.opnsense.list:
        target: 'ipsec_connection'
      register: opn_cm_before
      when: ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        'data' not in opn_pre1 or
        opn_pre1.data | length != 0

    - name: Removing - does not exist
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_1_1'
        state: 'absent'
      register: opn_pre2
      failed_when: >
        opn_pre2.failed or
        opn_pre2.changed

    - name: Adding 1 - failing because of invalid proposal (server-side)
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_1_1'
        proposals: 'INVALID-IP'
      register: opn_fail1
      failed_when: not opn_fail1.failed
      when: not ansible_check_mode

    - name: Adding 1
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_1_1'
        version: 'ikev2'
        unique: 'replace'
        proposals: ['default', 'aes256-sha256-modp2048', 'aes256gcm16-sha512-modp2048']
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed

    - name: Adding 1 - nothing changed
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_1_1'
        version: 'ikev2'
        unique: 'replace'
        proposals: ['default', 'aes256-sha256-modp2048', 'aes256gcm16-sha512-modp2048']
      register: opn2
      failed_when: >
        opn2.failed or
        opn2.changed
      when: not ansible_check_mode

    - name: Changing 1
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_1_1'
        unique: 'replace'
        proposals: 'aes256gcm16-sha512-modp2048'
        reauth_seconds: 3600
        keying_tries: 5
      register: opn3
      failed_when: >
        opn3.failed or
        not opn3.changed

    - name: Changing 1 - nothing changed
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_1_1'
        unique: 'replace'
        proposals: 'aes256gcm16-sha512-modp2048'
        reauth_seconds: 3600
        keying_tries: 5
      register: opn_rr1
      failed_when: >
        opn_rr1.failed or
        opn_rr1.changed
      when: not ansible_check_mode

    - name: Changing 1 - read back
      oxlorg.opnsense.list:
        target: 'ipsec_connection'
      register: opn_rb1
      vars:
        rb_entry: >-
          {{ opn_rb1.data | selectattr('name', 'equalto', "ANSIBLE_TEST_1_1") | list }}
        rb_proposals: >-
          {{ rb_entry[0]['proposals'].split(',') if rb_entry[0]['proposals'] is string else rb_entry[0]['proposals'] }}
      failed_when: >
        opn_rb1.failed or
        rb_entry | length != 1 or
        (rb_entry[0]['keying_tries'] | string) != "5" or
        (rb_proposals | map('string') | sort | join(',')) != "aes256gcm16-sha512-modp2048" or
        (rb_entry[0]['reauth_seconds'] | string) != "3600"
      when: not ansible_check_mode

    - name: Reload - service status before
      oxlorg.opnsense.service:
        name: 'ipsec'
        action: 'status'
      register: opn_rl_svc11
      when: not ansible_check_mode

    - name: Changing 1 - changed with reload
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_1_1'
        unique: 'replace'
        proposals: 'aes256gcm16-sha512-modp2048'
        reauth_seconds: 3600
        keying_tries: 5
        reload: true
        enabled: false
      register: opn_rl11_1
      failed_when: >
        opn_rl11_1.failed or
        not opn_rl11_1.changed
      when: not ansible_check_mode

    - name: Changing 1 - changed back with reload
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_1_1'
        unique: 'replace'
        proposals: 'aes256gcm16-sha512-modp2048'
        reauth_seconds: 3600
        keying_tries: 5
        reload: true
      register: opn_rl11_2
      failed_when: >
        opn_rl11_2.failed or
        not opn_rl11_2.changed
      when: not ansible_check_mode

    - name: Reload - service status unchanged
      oxlorg.opnsense.service:
        name: 'ipsec'
        action: 'status'
      register: opn_rl_svc11_after
      failed_when: >
        opn_rl_svc11_after.failed or
        (opn_rl_svc11_after.data.status | default('')) != (opn_rl_svc11.data.status | default(''))
      when: not ansible_check_mode

    - name: Disabling 1
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_1_1'
        unique: 'replace'
        proposals: 'aes256gcm16-sha512-modp2048'
        reauth_seconds: 3600
        keying_tries: 5
        enabled: false
      register: opn4
      failed_when: >
        opn4.failed or
        not opn4.changed
      when: not ansible_check_mode

    - name: Disabling 1 - nothing changed (w/ module alias)
      oxlorg.opnsense.ipsec_tunnel:
        name: 'ANSIBLE_TEST_1_1'
        unique: 'replace'
        proposals: 'aes256gcm16-sha512-modp2048'
        reauth_seconds: 3600
        keying_tries: 5
        enabled: false
      when: not ansible_check_mode

    - name: Disabling 1 - nothing changed
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_1_1'
        unique: 'replace'
        proposals: 'aes256gcm16-sha512-modp2048'
        reauth_seconds: 3600
        keying_tries: 5
        enabled: false
      register: opn5
      failed_when: >
        opn5.failed or
        opn5.changed
      when: not ansible_check_mode

    - name: Enabling 1
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_1_1'
        unique: 'replace'
        proposals: 'aes256gcm16-sha512-modp2048'
        reauth_seconds: 3600
        keying_tries: 5
      register: opn6
      failed_when: >
        opn6.failed or
        not opn6.changed
      when: not ansible_check_mode

    - name: Adding 2
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_1_2'
        unique: 'never'
        version: 'ikev1'
        reauth_seconds: 7200
        dpd_timeout_seconds: 7200
        dpd_delay_seconds: 7200
        over_seconds: 7200
        rekey_seconds: 7200
        keying_tries: 30
        encapsulation: true
        mobike: false
        aggressive: true
        local_addresses: ['192.168.1.1']
        local_port: 4500
        remote_addresses: ['192.168.2.1', '192.168.3.1']
        remote_port: 4500
      register: opn7
      failed_when: >
        opn7.failed or
        not opn7.changed

    - name: Adding 2 - nothing changed
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_1_2'
        unique: 'never'
        version: 'ikev1'
        reauth_seconds: 7200
        dpd_timeout_seconds: 7200
        dpd_delay_seconds: 7200
        over_seconds: 7200
        rekey_seconds: 7200
        keying_tries: 30
        encapsulation: true
        mobike: false
        aggressive: true
        local_addresses: ['192.168.1.1']
        local_port: 4500
        remote_addresses: ['192.168.2.1', '192.168.3.1']
        remote_port: 4500
      register: opn8
      failed_when: >
        opn8.failed or
        opn8.changed
      when: not ansible_check_mode

    - name: Removing 2
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_1_2'
        state: 'absent'
      register: opn9
      failed_when: >
        opn9.failed or
        not opn9.changed
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn10
      failed_when: >
        'data' not in opn10 or
        opn10.data | length != 1
      when: not ansible_check_mode

    - name: Cleanup
      oxlorg.opnsense.ipsec_connection:
        name: "{{ item }}"
        state: 'absent'
      loop:
        - 'ANSIBLE_TEST_1_1'
        - 'ANSIBLE_TEST_1_2'
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_clean1
      failed_when: >
        'data' not in opn_clean1 or
        opn_clean1.data | length != 0
      when: not ansible_check_mode

- name: Testing IPSec connection to pool linking
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Adding dummy pool 1
      oxlorg.opnsense.ipsec_pool:
        name: 'ANSIBLE_TEST_2_1'
        network: '192.168.2.0/29'
      when: not ansible_check_mode

    - name: Adding dummy pool 2
      oxlorg.opnsense.ipsec_pool:
        name: 'ANSIBLE_TEST_2_2'
        network: '192.168.3.0/29'
      when: not ansible_check_mode

    - name: Adding connection linked to pool
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_2_1'
        pools: ['ANSIBLE_TEST_2_1', 'ANSIBLE_TEST_2_2']
      register: opn11
      failed_when: >
        opn11.failed or
        not opn11.changed
      when: not ansible_check_mode

    - name: Nothing changed
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_2_1'
        pools: ['ANSIBLE_TEST_2_2', 'ANSIBLE_TEST_2_1']
      register: opn13
      failed_when: >
        opn13.failed or
        opn13.changed
      when: not ansible_check_mode

    - name: Changing linked pools
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_2_1'
        pools: ['ANSIBLE_TEST_2_1']
      register: opn12
      failed_when: >
        opn12.failed or
        not opn12.changed
      when: not ansible_check_mode

    - name: Changing linked pools - nothing changed
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_2_1'
        pools: ['ANSIBLE_TEST_2_1']
      register: opn_rr2
      failed_when: >
        opn_rr2.failed or
        opn_rr2.changed
      when: not ansible_check_mode

    - name: Cleanup connection
      oxlorg.opnsense.ipsec_connection:
        name: 'ANSIBLE_TEST_2_1'
        state: 'absent'
      when: not ansible_check_mode

    - name: Cleanup pools
      oxlorg.opnsense.ipsec_pool:
        name: "{{ item }}"
        state: 'absent'
      loop:
        - 'ANSIBLE_TEST_2_1'
        - 'ANSIBLE_TEST_2_2'
      when: not ansible_check_mode

    - name: Check mode - nothing was written
      oxlorg.opnsense.list:
        target: 'ipsec_connection'
      register: opn_cm_after
      failed_when: >
        opn_cm_after.failed or
        (opn_cm_after.data | to_json) != (opn_cm_before.data | to_json)
      when: ansible_check_mode
