---

# todo: test default matching

- name: Testing DHCRelay Destination
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'dhcrelay_destination'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Check mode - listing before
      oxlorg.opnsense.list:
        target: 'dhcrelay_destination'
      register: opn_cm_before
      when: ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn1
      failed_when: >
        'data' not in opn1 or
        opn1.data | length != 0

    - name: Removing - does not exist
      oxlorg.opnsense.dhcrelay_destination:
        name: 'ANSIBLE_TEST_1_1'
        state: 'absent'
        reload: false
      register: opn2
      failed_when: >
        opn2.failed or
        opn2.changed

    - name: Adding - failing because of invalid values
      oxlorg.opnsense.dhcrelay_destination:
        name: 'ANSIBLE_TEST_1_1'
        server: '{{ item }}'
        reload: false
      register: opn_fail1
      failed_when: not opn_fail1.failed
      loop:
        - ['dhcp']
        - ['172.0.0']
      when: not ansible_check_mode

    - name: Adding 1
      oxlorg.opnsense.dhcrelay_destination:
        name: 'ANSIBLE_TEST_1_1'
        server:
          - '192.168.254.254'
      register: opn3
      failed_when: >
        opn3.failed or
        not opn3.changed

    - name: Adding 2
      oxlorg.opnsense.dhcrelay_destination:
        name: 'ANSIBLE_TEST_1_2'
        server:
          - '192.168.254.252'
          - '192.168.254.253'
      register: opn4
      failed_when: >
        opn4.failed or
        not opn4.changed

    - name: Adding 2 - nothing changed
      oxlorg.opnsense.dhcrelay_destination:
        name: 'ANSIBLE_TEST_1_2'
        server:
          - '192.168.254.252'
          - '192.168.254.253'
      register: opn5
      failed_when: >
        opn5.failed or
        opn5.changed
      when: not ansible_check_mode

    - name: Adding 2 - changed with reload
      oxlorg.opnsense.dhcrelay_destination:
        name: 'ANSIBLE_TEST_1_2'
        reload: true
        server:
          - "192.168.254.252"
      register: opn_rl22_1
      failed_when: >
        opn_rl22_1.failed or
        not opn_rl22_1.changed
      when: not ansible_check_mode

    - name: Adding 2 - changed back with reload
      oxlorg.opnsense.dhcrelay_destination:
        name: 'ANSIBLE_TEST_1_2'
        server:
          - '192.168.254.252'
          - '192.168.254.253'
        reload: true
      register: opn_rl22_2
      failed_when: >
        opn_rl22_2.failed or
        not opn_rl22_2.changed
      when: not ansible_check_mode

    - name: Removing 2
      oxlorg.opnsense.dhcrelay_destination:
        name: 'ANSIBLE_TEST_1_2'
        state: 'absent'
      register: opn6
      failed_when: >
        opn6.failed or
        not opn6.changed
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn7
      failed_when: >
        'data' not in opn7 or
        opn7.data | length != 1
      when: not ansible_check_mode

    - name: Cleanup
      oxlorg.opnsense.dhcrelay_destination:
        name: 'ANSIBLE_TEST_1_1'
        state: 'absent'
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn8
      failed_when: >
        'data' not in opn8 or
        opn8.data | length != 0
      when: not ansible_check_mode

    - name: Check mode - nothing was written
      oxlorg.opnsense.list:
        target: 'dhcrelay_destination'
      register: opn_cm_after
      failed_when: >
        opn_cm_after.failed or
        (opn_cm_after.data | to_json) != (opn_cm_before.data | to_json)
      when: ansible_check_mode
