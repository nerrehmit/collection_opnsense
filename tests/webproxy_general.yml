---

- name: WebProxy General Settings
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'webproxy_general'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Check mode - listing before
      oxlorg.opnsense.list:
        target: 'webproxy_general'
      register: opn_cm_before
      when: ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        opn_pre1.failed or
        'data' not in opn_pre1

    - name: Configuring - failing because of invalid connect_timeout
      oxlorg.opnsense.webproxy_general:
        connect_timeout: 200
      register: opn_fail1
      failed_when: not opn_fail1.failed

    - name: Configuring
      oxlorg.opnsense.webproxy_general:
        errors: 'custom'
        icp_port: 50000
        log: true
        log_store: true
        log_target: 'file_json'
        dns_servers: ['192.168.0.1', '192.168.10.1']
        handling_forwarded_for: 'truncate'
        suppress_version: true
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed

    - name: Configuring - nothing changed
      oxlorg.opnsense.webproxy_general:
        errors: 'custom'
        icp_port: 50000
        log: true
        log_store: true
        log_target: 'file_json'
        dns_servers: ['192.168.0.1', '192.168.10.1']
        handling_forwarded_for: 'truncate'
        suppress_version: true
      register: opn_rr1
      failed_when: >
        opn_rr1.failed or
        opn_rr1.changed
      when: not ansible_check_mode

    - name: Changing 1
      oxlorg.opnsense.webproxy_general:
        errors: 'squid'
        icp_port: 30000
        log: true
        log_store: true
        log_target: 'syslog'
        log_ignore: ['192.168.50.0/24']
        email: 'netadmin@oxlorg.net'
        handling_forwarded_for: 'truncate'
        suppress_version: false
      register: opn9
      failed_when: >
        opn9.failed or
        not opn9.changed
      when: not ansible_check_mode

    - name: Changing 1 - nothing changed
      oxlorg.opnsense.webproxy_general:
        errors: 'squid'
        icp_port: 30000
        log: true
        log_store: true
        log_target: 'syslog'
        log_ignore: ['192.168.50.0/24']
        email: 'netadmin@oxlorg.net'
        handling_forwarded_for: 'truncate'
        suppress_version: false
      register: opn_rr2
      failed_when: >
        opn_rr2.failed or
        opn_rr2.changed
      when: not ansible_check_mode

    - name: Disabling 1
      oxlorg.opnsense.webproxy_general:
        errors: 'squid'
        icp_port: 30000
        log: true
        log_store: true
        log_target: 'syslog'
        log_ignore: ['192.168.50.0/24']
        email: 'netadmin@oxlorg.net'
        handling_forwarded_for: 'truncate'
        suppress_version: false
        enabled: false
      register: opn2
      failed_when: >
        opn2.failed or
        not opn2.changed
      when: not ansible_check_mode

    - name: Disabling 1 - nothing changed
      oxlorg.opnsense.webproxy_general:
        errors: 'squid'
        icp_port: 30000
        log: true
        log_store: true
        log_target: 'syslog'
        log_ignore: ['192.168.50.0/24']
        email: 'netadmin@oxlorg.net'
        handling_forwarded_for: 'truncate'
        suppress_version: false
        enabled: false
      register: opn3
      failed_when: >
        opn3.failed or
        opn3.changed
      when: not ansible_check_mode

    - name: Enabling 1
      oxlorg.opnsense.webproxy_general:
        errors: 'squid'
        icp_port: 30000
        log: true
        log_store: true
        log_target: 'syslog'
        log_ignore: ['192.168.50.0/24']
        email: 'netadmin@oxlorg.net'
        handling_forwarded_for: 'truncate'
        suppress_version: false
      register: opn4
      failed_when: >
        opn4.failed or
        not opn4.changed
      when: not ansible_check_mode

    - name: Cleanup
      oxlorg.opnsense.webproxy_general:
        enabled: false
      when: not ansible_check_mode

    - name: Check mode - nothing was written
      oxlorg.opnsense.list:
        target: 'webproxy_general'
      register: opn_cm_after
      failed_when: >
        opn_cm_after.failed or
        (opn_cm_after.data | to_json) != (opn_cm_before.data | to_json)
      when: ansible_check_mode
