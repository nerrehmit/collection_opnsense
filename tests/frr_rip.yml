---

- name: Testing RIP
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'frr_rip'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Check mode - listing before
      oxlorg.opnsense.list:
        target: 'frr_rip'
      register: opn_cm_before
      when: ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: opn_pre1.failed

    - name: Configuring - failing because of invalid version number
      oxlorg.opnsense.frr_rip:
        version: 3
      register: opn_fail1
      failed_when: not opn_fail1.failed

    - name: Configuring - failing because of invalid metric
      oxlorg.opnsense.frr_rip:
        metric: 50
      register: opn_fail1
      failed_when: not opn_fail1.failed

    - name: Configuring
      oxlorg.opnsense.frr_rip:
        passive_ints: ['lan']
        redistribute: ['static']
        networks: ['10.0.10.0/24']
        enabled: true
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed

    - name: Configuring - nothing changed
      oxlorg.opnsense.frr_rip:
        passive_ints: ['lan']
        redistribute: ['static']
        networks: ['10.0.10.0/24']
        enabled: true
      register: opn_rr1
      failed_when: >
        opn_rr1.failed or
        opn_rr1.changed
      when: not ansible_check_mode

    - name: Changing
      oxlorg.opnsense.frr_rip:
        passive_ints: ['lan']
        redistribute: ['static', 'ospf']
        networks: ['10.0.11.0/24']
        metric: 6
        enabled: true
      register: opn9
      failed_when: >
        opn9.failed or
        not opn9.changed

    - name: Changing - nothing changed
      oxlorg.opnsense.frr_rip:
        passive_ints: ['lan']
        redistribute: ['static', 'ospf']
        networks: ['10.0.11.0/24']
        metric: 6
        enabled: true
      register: opn_rr2
      failed_when: >
        opn_rr2.failed or
        opn_rr2.changed
      when: not ansible_check_mode

    - name: Disabling 1
      oxlorg.opnsense.frr_rip:
        passive_ints: ['lan']
        redistribute: ['static', 'ospf']
        networks: ['10.0.11.0/24']
        metric: 6
        enabled: false
      register: opn2
      failed_when: >
        opn2.failed or
        not opn2.changed
      when: not ansible_check_mode

    - name: Disabling 1 - nothing changed
      oxlorg.opnsense.frr_rip:
        passive_ints: ['lan']
        redistribute: ['static', 'ospf']
        networks: ['10.0.11.0/24']
        metric: 6
        enabled: false
      register: opn3
      failed_when: >
        opn3.failed or
        opn3.changed
      when: not ansible_check_mode

    - name: Enabling 1
      oxlorg.opnsense.frr_rip:
        passive_ints: ['lan']
        redistribute: ['static', 'ospf']
        networks: ['10.0.11.0/24']
        metric: 6
      register: opn4
      failed_when: >
        opn4.failed or
        not opn4.changed
      when: not ansible_check_mode

    - name: Cleanup
      oxlorg.opnsense.frr_rip:
        enabled: false
      when: not ansible_check_mode

    - name: Check mode - nothing was written
      oxlorg.opnsense.list:
        target: 'frr_rip'
      register: opn_cm_after
      failed_when: >
        opn_cm_after.failed or
        (opn_cm_after.data | to_json) != (opn_cm_before.data | to_json)
      when: ansible_check_mode
