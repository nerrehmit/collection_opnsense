---

- name: Testing FRR general settings
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'frr_general'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Check mode - listing before
      oxlorg.opnsense.list:
        target: 'frr_general'
      register: opn_cm_before
      when: ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        opn_pre1.failed or
        'data' not in opn_pre1

    - name: Configuring
      oxlorg.opnsense.frr_general:
        enabled: true
        profile: 'traditional'
        log: true
        log_level: 'notifications'
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed

    - name: Configuring - nothing changed
      oxlorg.opnsense.frr_general:
        enabled: true
        profile: 'traditional'
        log: true
        log_level: 'notifications'
      register: opn_rr1
      failed_when: >
        opn_rr1.failed or
        opn_rr1.changed
      when: not ansible_check_mode

    - name: Changing
      oxlorg.opnsense.frr_general:
        enabled: true
        profile: 'datacenter'
        log: true
        log_level: 'emergencies'
        snmp_agentx: true
      register: opn5
      failed_when: >
        opn5.failed or
        not opn5.changed

    - name: Changing - nothing changed
      oxlorg.opnsense.frr_general:
        enabled: true
        profile: 'datacenter'
        log: true
        log_level: 'emergencies'
        snmp_agentx: true
      register: opn_rr2
      failed_when: >
        opn_rr2.failed or
        opn_rr2.changed
      when: not ansible_check_mode

    - name: Disabling 1
      oxlorg.opnsense.frr_general:
        profile: 'datacenter'
        log: true
        log_level: 'emergencies'
        snmp_agentx: true
        enabled: false
      register: opn2
      failed_when: >
        opn2.failed or
        not opn2.changed
      when: not ansible_check_mode

    - name: Disabling 1 - nothing changed
      oxlorg.opnsense.frr_general:
        profile: 'datacenter'
        log: true
        log_level: 'emergencies'
        snmp_agentx: true
        enabled: false
      register: opn3
      failed_when: >
        opn3.failed or
        opn3.changed
      when: not ansible_check_mode

    - name: Enabling 1
      oxlorg.opnsense.frr_general:
        profile: 'datacenter'
        log: true
        log_level: 'emergencies'
        snmp_agentx: true
        enabled: true
      register: opn4
      failed_when: >
        opn4.failed or
        not opn4.changed
      when: not ansible_check_mode

    - name: Cleanup
      oxlorg.opnsense.frr_general:
        enabled: false
        profile: 'traditional'
        carp: false
        snmp_agentx: false
        log: true
        log_level: 'notifications'
      when: not ansible_check_mode

    - name: Check mode - nothing was written
      oxlorg.opnsense.list:
        target: 'frr_general'
      register: opn_cm_after
      failed_when: >
        opn_cm_after.failed or
        (opn_cm_after.data | to_json) != (opn_cm_before.data | to_json)
      when: ansible_check_mode
