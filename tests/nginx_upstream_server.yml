---

- name: Testing Nginx upstream server
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'nginx_upstream_server'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Check mode - listing before
      oxlorg.opnsense.list:
        target: 'nginx_upstream_server'
      register: opn_cm_before
      when: ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        'data' not in opn_pre1 or
        opn_pre1.data | length != 0

    - name: Removing - does not exist
      oxlorg.opnsense.nginx_upstream_server:
        name: 'ANSIBLE@TEST1'
        state: 'absent'
      register: opn_pre2
      failed_when: >
        opn_pre2.failed or
        opn_pre2.changed

    - name: Adding 1 - failing because of missing server
      oxlorg.opnsense.nginx_upstream_server:
        name: 'ANSIBLE@TEST1'
      register: opn_fail1
      failed_when: not opn_fail1.failed

    - name: Adding 1 - failing because of missing port
      oxlorg.opnsense.nginx_upstream_server:
        name: 'ANSIBLE@TEST1'
        server: 192.168.1.1
      register: opn_fail1
      failed_when: not opn_fail1.failed

    - name: Adding 1 - failing because of missing priority
      oxlorg.opnsense.nginx_upstream_server:
        name: 'ANSIBLE@TEST1'
        server: 192.168.1.1
        port: 80
      register: opn_fail1
      failed_when: not opn_fail1.failed

    - name: Adding 1 - should succeed
      oxlorg.opnsense.nginx_upstream_server:
        name: 'ANSIBLE@TEST1'
        server: 192.168.1.1
        port: 80
        priority: 1

    - name: Adding 1 - should succeed and not change
      oxlorg.opnsense.nginx_upstream_server:
        name: 'ANSIBLE@TEST1'
        server: 192.168.1.1
        port: 80
        priority: 1
      register: ng1
      failed_when: >
        ng1.failed or
        ng1.changed
      when: not ansible_check_mode

    - name: Reload - service status before
      oxlorg.opnsense.service:
        name: 'nginx'
        action: 'status'
      register: opn_rl_svc27
      when: not ansible_check_mode

    - name: Adding 1 - should succeed - changed with reload
      oxlorg.opnsense.nginx_upstream_server:
        name: 'ANSIBLE@TEST1'
        server: 192.168.1.1
        port: 80
        reload: true
        priority: 2
      register: opn_rl27_1
      failed_when: >
        opn_rl27_1.failed or
        not opn_rl27_1.changed
      when: not ansible_check_mode

    - name: Adding 1 - should succeed - changed back with reload
      oxlorg.opnsense.nginx_upstream_server:
        name: 'ANSIBLE@TEST1'
        server: 192.168.1.1
        port: 80
        priority: 1
        reload: true
      register: opn_rl27_2
      failed_when: >
        opn_rl27_2.failed or
        not opn_rl27_2.changed
      when: not ansible_check_mode

    - name: Reload - service status unchanged
      oxlorg.opnsense.service:
        name: 'nginx'
        action: 'status'
      register: opn_rl_svc27_after
      failed_when: >
        opn_rl_svc27_after.failed or
        (opn_rl_svc27_after.data.status | default('')) != (opn_rl_svc27.data.status | default(''))
      when: not ansible_check_mode

    - name: Remove 1 - should succeed
      oxlorg.opnsense.nginx_upstream_server:
        name: 'ANSIBLE@TEST1'
        state: 'absent'
      when: not ansible_check_mode

    - name: Check mode - nothing was written
      oxlorg.opnsense.list:
        target: 'nginx_upstream_server'
      register: opn_cm_after
      failed_when: >
        opn_cm_after.failed or
        (opn_cm_after.data | to_json) != (opn_cm_before.data | to_json)
      when: ansible_check_mode
