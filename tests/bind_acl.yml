---

- name: Testing BIND ACLs
  hosts: localhost
  gather_facts: no
  module_defaults:
    group/oxlorg.opnsense.all:
      firewall: "{{ lookup('ansible.builtin.env', 'TEST_FIREWALL') }}"
      api_credential_file: "{{ lookup('ansible.builtin.env', 'TEST_API_KEY') }}"
      ssl_verify: false

    oxlorg.opnsense.list:
      target: 'bind_acl'

  environment:
    HTTPS_PROXY: "{{ lookup('ansible.builtin.env', 'TEST_PROXY') | default('') }}"

  tasks:
    - name: Check mode - listing before
      oxlorg.opnsense.list:
        target: 'bind_acl'
      register: opn_cm_before
      when: ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_pre1
      failed_when: >
        opn_pre1.failed or
        'data' not in opn_pre1 or
        opn_pre1.data | length > 0

    - name: Adding - failing because of invalid names
      oxlorg.opnsense.bind_acl:
        name: "{{ item }}"
        networks: ['192.168.0.0/24']
      register: opn_fail1
      failed_when: not opn_fail1.failed
      loop:
        - 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
        - 'localhost'

    - name: Adding - failing because no network was provided
      oxlorg.opnsense.bind_acl:
        name: 'ANSIBLE_TEST_1_1'
      register: opn_fail2
      failed_when: not opn_fail2.failed

    - name: Adding - failing because an invalid network was provided
      oxlorg.opnsense.bind_acl:
        name: 'ANSIBLE_TEST_1_1'
        networks: ['192.168.0.0/258']
      register: opn_fail3
      failed_when: not opn_fail3.failed

    - name: Adding 1
      oxlorg.opnsense.bind_acl:
        name: 'ANSIBLE_TEST_1_1'
        networks: ['192.168.0.0/24']
      register: opn1
      failed_when: >
        opn1.failed or
        not opn1.changed

    - name: Changing 1
      oxlorg.opnsense.bind_acl:
        name: 'ANSIBLE_TEST_1_1'
        networks: ['192.168.0.0/25']
      register: opn9
      failed_when: >
        opn9.failed or
        not opn9.changed

    - name: Changing 1 - nothing changed
      oxlorg.opnsense.bind_acl:
        name: 'ANSIBLE_TEST_1_1'
        networks: ['192.168.0.0/25']
      register: opn_rr1
      failed_when: >
        opn_rr1.failed or
        opn_rr1.changed
      when: not ansible_check_mode

    - name: Changing 1 - read back
      oxlorg.opnsense.list:
        target: 'bind_acl'
      register: opn_rb1
      vars:
        rb_entry: >-
          {{ opn_rb1.data | selectattr('name', 'equalto', "ANSIBLE_TEST_1_1") | list }}
        rb_networks: >-
          {{ rb_entry[0]['networks'].split(',') if rb_entry[0]['networks'] is string else rb_entry[0]['networks'] }}
      failed_when: >
        opn_rb1.failed or
        rb_entry | length != 1 or
        (rb_networks | map('string') | sort | join(',')) != "192.168.0.0/25"
      when: not ansible_check_mode

    - name: Reload - service status before
      oxlorg.opnsense.service:
        name: 'bind'
        action: 'status'
      register: opn_rl_svc19
      when: not ansible_check_mode

    - name: Changing 1 - changed with reload
      oxlorg.opnsense.bind_acl:
        name: 'ANSIBLE_TEST_1_1'
        networks: ['192.168.0.0/25']
        reload: true
        enabled: false
      register: opn_rl19_1
      failed_when: >
        opn_rl19_1.failed or
        not opn_rl19_1.changed
      when: not ansible_check_mode

    - name: Changing 1 - changed back with reload
      oxlorg.opnsense.bind_acl:
        name: 'ANSIBLE_TEST_1_1'
        networks: ['192.168.0.0/25']
        reload: true
      register: opn_rl19_2
      failed_when: >
        opn_rl19_2.failed or
        not opn_rl19_2.changed
      when: not ansible_check_mode

    - name: Reload - service status unchanged
      oxlorg.opnsense.service:
        name: 'bind'
        action: 'status'
      register: opn_rl_svc19_after
      failed_when: >
        opn_rl_svc19_after.failed or
        (opn_rl_svc19_after.data.status | default('')) != (opn_rl_svc19.data.status | default(''))
      when: not ansible_check_mode

    - name: Disabling 1
      oxlorg.opnsense.bind_acl:
        name: 'ANSIBLE_TEST_1_1'
        networks: ['192.168.0.0/25']
        enabled: false
      register: opn2
      failed_when: >
        opn2.failed or
        not opn2.changed
      when: not ansible_check_mode

    - name: Disabling 1 - nothing changed
      oxlorg.opnsense.bind_acl:
        name: 'ANSIBLE_TEST_1_1'
        networks: ['192.168.0.0/25']
        enabled: false
      register: opn3
      failed_when: >
        opn3.failed or
        opn3.changed
      when: not ansible_check_mode

    - name: Enabling 1
      oxlorg.opnsense.bind_acl:
        name: 'ANSIBLE_TEST_1_1'
        networks: ['192.168.0.0/25']
      register: opn4
      failed_when: >
        opn4.failed or
        not opn4.changed
      when: not ansible_check_mode

    - name: Adding 2
      oxlorg.opnsense.bind_acl:
        name: 'ANSIBLE_TEST_1_2'
        networks: ['192.168.0.128/29', '192.168.0.192/29']
      register: opn5
      failed_when: >
        opn5.failed or
        not opn5.changed
      when: not ansible_check_mode

    - name: Adding 2 - Nothing changed
      oxlorg.opnsense.bind_acl:
        name: 'ANSIBLE_TEST_1_2'
        networks: ['192.168.0.128/29', '192.168.0.192/29']
      register: opn6
      failed_when: >
        opn6.failed or
        opn6.changed
      when: not ansible_check_mode

    - name: Removing 2
      oxlorg.opnsense.bind_acl:
        name: 'ANSIBLE_TEST_1_2'
        state: 'absent'
      register: opn7
      failed_when: >
        opn7.failed or
        not opn7.changed
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn8
      failed_when: >
        'data' not in opn8 or
        opn8.data | length != 1
      when: not ansible_check_mode

    - name: Cleanup
      oxlorg.opnsense.bind_acl:
        name: "{{ item }}"
        state: 'absent'
      loop:
        - 'ANSIBLE_TEST_1_1'
        - 'ANSIBLE_TEST_1_2'
      when: not ansible_check_mode

    - name: Listing
      oxlorg.opnsense.list:
      register: opn_clean1
      failed_when: >
        'data' not in opn_clean1 or
        opn_clean1.data | length != 0
      when: not ansible_check_mode

    - name: Check mode - nothing was written
      oxlorg.opnsense.list:
        target: 'bind_acl'
      register: opn_cm_after
      failed_when: >
        opn_cm_after.failed or
        (opn_cm_after.data | to_json) != (opn_cm_before.data | to_json)
      when: ansible_check_mode
